[project]
name = "woodshed"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "beat-this>=1.1.0",
    "onnx>=1.23.0",
    "onnxscript>=0.7.2",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
